source = ~/.config/hypr/hyprlock-colors.conf

general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
    immediate_render    = true
    ignore_empty_input  = true
}

background {
    monitor =
    path    = screenshot
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.5
}

input-field {
    monitor =
    size = 300 50
    outline_thickness = 2
    dots_size         = 0.3
    dots_spacing      = 0.15
    outer_color = $hl_outer_color
    inner_color = $hl_inner_color
    font_color  = $hl_font_color
    fade_on_empty     = true
    placeholder_text  = <i>Contraseña...</i>
    position          = 0, -80
    halign            = center
    valign            = center
}

label {
    monitor =
    text     = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = $hl_font_color
    font_size   = 64
    font_family = JetBrainsMono Nerd Font
    position    = 0, 80
    halign      = center
    valign      = center
}
